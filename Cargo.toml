[package]
name = "dlna-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
clap = { version = "4", features = ["derive"] }
facet = "0.46"
facet-styx = "3"
gethostname = "0.5"
http-range-header = "0.4"
librqbit-upnp-serve = "1.0"
mime_guess = "2"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "signal", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
percent-encoding = "2"
socket2 = "0.5"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

[patch.crates-io]
librqbit-upnp-serve = { path = "vendor/librqbit-upnp-serve" }
librqbit-upnp = { git = "https://github.com/ikatson/rqbit" }
librqbit-core = { git = "https://github.com/ikatson/rqbit" }
librqbit-buffers = { git = "https://github.com/ikatson/rqbit" }
librqbit-bencode = { git = "https://github.com/ikatson/rqbit" }
librqbit-clone-to-owned = { git = "https://github.com/ikatson/rqbit" }
