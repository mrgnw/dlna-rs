[package]
name = "librqbit-upnp-serve"
version = "1.0.1"
edition = "2024"
description = "Simple UPnP MediaServer implementation"
license = "Apache-2.0"
documentation = "https://docs.rs/librqbit-upnp-serve"
repository = "https://github.com/ikatson/rqbit"
readme = "README.md"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
bstr = "1"
serde = "1"
serde_derive = "1"
http = "1"
httparse = "1"
uuid = { version = "1", features = ["v4"] }
librqbit-upnp = "9.1"
gethostname = "1"
librqbit-core = { version = "9.1", default-features = false }
mime_guess = { version = "2", default-features = false }
url = { version = "2", default-features = false }
parking_lot = "0.12"
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false }
quick-xml = { version = "0.41", features = ["serialize"] }
network-interface = "2"
futures = "0.3"
librqbit-dualstack-sockets = "0.7"
rand = "0.9"

[dev-dependencies]
tracing-subscriber = { version = "0.3", default-features = false }
tower-http = { version = "0.6", features = ["trace"] }

[[example]]
name = "upnp-stub-server"
